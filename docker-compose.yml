services:
  mongo:
    image: mongo:7
    container_name: catalog-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: basket-redis
    ports:
      - "6379:6379"

  redis:
    image: redis:7
    container_name: basket-redis
    ports:
      - "6379:6379"

  catalogapi:
    build:
      context: .
      dockerfile: Catalog/Catalog.api/Dockerfile
    container_name: catalog-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DatabaseSettings__ConnectionString: mongodb://mongo:27017
      DatabaseSettings__DatabaseName: CatalogDb
      DatabaseSettings__ProductsCollection: Products
      DatabaseSettings__BrandsCollection: Brands
      DatabaseSettings__TypesCollection: Types
    volumes:
      - ./Catalog:/src/Catalog:ro
    depends_on:
      - mongo

  basketapi:
    build:
      context: .
      dockerfile: Basket/Basket.api/Dockerfile
    container_name: basket-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      CacheSettings__ConnectionString: redis:6379
    depends_on:
      - redis

  basketapi:
    build:
      context: .
      dockerfile: Basket/Basket.api/Dockerfile
    container_name: basket-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      CacheSettings__ConnectionString: redis:6379
    depends_on:
      - redis

volumes:
  mongo_data: